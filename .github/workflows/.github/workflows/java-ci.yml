name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 26
      uses: actions/setup-java@v3
      with:
        java-version: 26
        distribution: temurin

    - name: Build project
      run: javac -d out src/main/aplicacao/*.java src/main/modelo/*.java src/main/servico/*.java src/main/utilitario/*.java

    - name: Run tests
      run: java -cp out org.junit.platform.console.ConsoleLauncher --scan-class-path
